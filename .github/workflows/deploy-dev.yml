# Dev deploy: push (= PR merge) to `deploy/development` → static export build →
# deploy worker (assets) to docs-dev.quipier.com. Build-time env comes from the
# committed .env.dev (non-secret). Secrets: CLOUDFLARE_API_TOKEN / ACCOUNT_ID.
name: Deploy dev (Cloudflare Workers)

on:
  push:
    branches: [deploy/development]

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # fumadocs-mdx + next typegen + tsc — type gate before building.
      - run: npm run types:check

      - name: Build (static export) + deploy worker (dev)
        run: npm run deploy:dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
