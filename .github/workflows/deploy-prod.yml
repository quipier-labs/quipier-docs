# Prod deploy: push (= PR merge) to `deploy/production` → static export build →
# deploy worker (assets) to docs.quipier.com. Build-time env from committed
# .env.prod (non-secret). Secrets: CLOUDFLARE_API_TOKEN / ACCOUNT_ID.
name: Deploy prod (Cloudflare Workers)

on:
  push:
    branches: [deploy/production]

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run types:check
      - name: Build (static export) + deploy worker (prod)
        run: npm run deploy:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
