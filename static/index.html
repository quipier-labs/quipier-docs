<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quipier Docs</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: #0a0a0a; color: #f5f5f5;
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        display: grid; place-items: center; min-height: 100vh; padding: 24px;
      }
      .wrap { max-width: 440px; text-align: center; }
      .brand { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
      .tag {
        display: inline-block; margin-left: 8px; font-size: 11px; font-weight: 700;
        color: #4d8eff; border: 1px solid #2a2a2a; border-radius: 999px; padding: 2px 8px;
        vertical-align: middle;
      }
      p { color: #999; line-height: 1.7; margin: 16px 0 28px; }
      .btn {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 11px 18px; border-radius: 10px; font-weight: 600; font-size: 14px;
        background: #fff; color: #0a0a0a; text-decoration: none;
      }
      .btn:hover { opacity: 0.9; }
      .links { margin-top: 18px; font-size: 13px; }
      .links a { color: #999; text-decoration: none; }
      .links a:hover { color: #f5f5f5; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand">Quipier<span class="tag">docs</span></div>
      <p>문서는 준비 중입니다. 지금은 SDK 통합을 바로 시험해 볼 수 있는 플레이그라운드를 제공합니다.</p>
      <a class="btn" href="/example/">플레이그라운드 열기 →</a>
      <div class="links">
        <a href="https://github.com/quipier-labs/quipier.js" target="_blank" rel="noreferrer">@quipier/sdk on GitHub ↗</a>
      </div>
    </div>
  </body>
</html>
